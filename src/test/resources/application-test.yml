spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/smarttourism}
    username: ${TEST_DB_USERNAME:smarttourism}
    password: ${TEST_DB_PASSWORD:smarttourism123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025
    username: test@test.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

security:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-must-be-at-least-256-bits
    expiration-ms: 3600000

cors:
  allowed-origins: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  level:
    com.smarttourism.backend: DEBUG
    org.springframework.security: DEBUG
